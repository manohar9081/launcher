<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Cheatsheets</title>

<style>
  :root { --accent: #4dd0e1; }

         background:#0d1117; color:#c9d1d9; }
  a { color: var(--accent); }
  header { position:sticky; top:0; z-index:10; background:rgba(13,17,23,.88); backdrop-filter:blur(8px);
           border-bottom:1px solid #21262d; }
  .wrap { max-width:980px; margin:0 auto; padding:0 20px; }
  h1 { margin:0; padding:16px 0 0; font-size:20px; color:#f0f6fc; letter-spacing:.01em; }
  h1 .dot { color:var(--accent); }
  .controls { display:flex; gap:10px; margin:12px 0 10px; flex-wrap:wrap; }
  select, input[type="search"] { background:#161b22; border:1px solid #30363d; color:#e6edf3;
           padding:9px 12px; border-radius:8px; font-size:14px; }
  select { min-width:250px; cursor:pointer; }
  #search { flex:1; min-width:180px; }
  select:focus, #search:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,255,255,.06); }
  .blurb { margin:4px 0 0; color:#8b949e; font-size:13.5px; }
  .meta { margin:8px 0 16px; color:#6e7681; font-size:12.5px; }
  .notes { border-left:3px solid var(--accent); background:rgba(255,255,255,.03); padding:10px 14px;
           border-radius:0 8px 8px 0; font-size:13px; color:#adbac7; margin:0 0 14px; }
  .notes ul { margin:4px 0; padding-left:18px; }
  .notes li { margin:4px 0; }
  .card { background:#161b22; border:1px solid #21262d; border-radius:12px; padding:16px 20px 10px; margin:14px 0; }
  .card h2 { margin:0 0 2px; font-size:16px; color:var(--accent); }
  .intro { color:#8b949e; font-size:12.5px; margin:2px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:#8b949e;
       padding:6px 10px; border-bottom:1px solid #30363d; }
  td { padding:7px 10px; border-bottom:1px solid #21262d; vertical-align:top; line-height:1.5; }
  tr:last-child td { border-bottom:none; }
  td.k { width:42%; }
  td.k code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:12px;
       background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:2px 7px; display:inline-block;
       margin:1px 2px 1px 0; color:#79c0ff; overflow-wrap:anywhere; }
  pre { background:#0a0d12; border:1px solid #21262d; border-radius:8px; padding:12px 14px; overflow-x:auto;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; color:#c9d1d9;
        line-height:1.55; margin:10px 0; }
  mark { background:#e3b341; color:#1b1f24; border-radius:3px; padding:0 2px; }
  .empty { padding:48px 20px; text-align:center; color:#8b949e; font-size:14px; }
  footer { text-align:center; color:#484f58; font-size:12px; padding:28px 20px 40px; }
  @media (max-width:640px){ td.k{width:48%;} .controls{flex-direction:column;} select{min-width:0;} }
  @media print {
    body{background:#fff;color:#111;} header{position:static;background:#fff;}
    .controls,.meta{display:none;} .card{border-color:#ddd;background:#fff;break-inside:avoid;}
    td.k code{background:#f6f8fa;border-color:#ddd;color:#0550ae;} th,td{border-color:#ddd;color:#111;}
    .card h2{color:#0550ae;} pre{background:#f6f8fa;color:#111;border-color:#ddd;}
    .notes{background:#f6f8fa;color:#333;border-color:#0550ae;}
  }
</style>
</head>

<header>

</header>
<main class="wrap" id="content"><noscript>This page needs JavaScript enabled.</noscript></main>

/* ============ RENDERING ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  try { return t.replace(new RegExp(esc(escRe(q)), "gi"), m => "<mark>" + m + "</mark>"); }
  catch(e) { return t; }
}

let current = localStorage.getItem("cs.sheet");
if(!SHEETS.some(s => s.id === current)) current = "terminal";

const select = $("#sheet-select");
const groups = {};
SHEETS.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
for(const g of Object.keys(groups)){
  const og = document.createElement("optgroup"); og.label = g;
  groups[g].forEach(s => {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.icon + "  " + s.label;
    og.appendChild(o);
  });
  select.appendChild(og);
}
select.value = current;

function render(){
  const sheet = SHEETS.find(s => s.id === current);
  document.documentElement.style.setProperty("--accent", sheet.accent);
  document.title = sheet.label + " — Cheatsheet";
  const q = $("#search").value.trim();
  const lq = q.toLowerCase();

  let html = "";
  if(sheet.notes){
    html += '<div class="notes"><ul>' + sheet.notes.map(n => "<li>" + hl(n,q) + "</li>").join("") + "</ul></div>";
  }

  let shown = 0, total = 0, sectionsShown = 0;
  for(const sec of sheet.sections){
    total += sec.rows.length;
    const rows = sec.rows.filter(r => !q ||
      String(r[0]).toLowerCase().includes(lq) || String(r[1]).toLowerCase().includes(lq));
    if(q && rows.length === 0) continue;
    sectionsShown++; shown += rows.length;
    html += '<section class="card"><h2>' + hl(sec.title,q) + "</h2>";
    if(sec.intro) html += '<p class="intro">' + hl(sec.intro,q) + "</p>";
    html += "<table><thead><tr><th>Key / Command</th><th>What it does</th></tr></thead><tbody>";
    for(const r of rows){
      html += '<tr><td class="k"><code>' + hl(r[0],q) + "</code></td><td>" + hl(r[1],q) + "</td></tr>";
    }
    html += "</tbody></table>";
    if(sec.code) html += "<pre>" + esc(sec.code) + "</pre>";
    html += "</section>";
  }
  if(q && shown === 0){
    html = '<div class="notes"><ul><li>No matches — the search covers keys and descriptions of this sheet only.</li></ul></div>' +
           '<p class="empty">Nothing found for “' + esc(q) + "” in " + esc(sheet.label) + "</p>";
  }
  $("#content").innerHTML = html;
  $("#blurb").textContent = sheet.blurb;
  $("#meta").textContent = q
    ? shown + (shown === 1 ? " match" : " matches") + " for “" + q + "” · " + sheet.label
    : sheet.sections.length + " sections · " + total + " entries · " + sheet.label;
}

select.addEventListener("change", () => {
  current = select.value;
  localStorage.setItem("cs.sheet", current);
  $("#search").value = "";
  render();
});

$("#search").addEventListener("input", render);
$("#search").addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("#search").value = ""; $("#search").blur(); render(); }
});

window.addEventListener("keydown", e => {
  if(e.key === "/" && !["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)){
    e.preventDefault(); $("#search").focus();
  }
});

render();
</script>
